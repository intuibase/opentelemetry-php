name: segv-debug

on:
  push:
    branches: ['tmp/ci-segv-debug', 'tmp/ci-segv-main']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  segv:
    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: full-suite-ubuntu-26.04
            os: ubuntu-26.04
            target: --testsuite unit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: xdebug
          extensions: ast, grpc, opentelemetry, protobuf, yaml
      - run: composer install --prefer-dist --no-progress
      - name: Environment
        run: |
          php -v
          php -m | tr '\n' ' '
          php --ri opentelemetry | head -8
          php --ri xdebug | grep -iE "version|mode"
      - name: Facts
        run: |
          lsb_release -d; ldd --version | head -1; php -v | head -1; which php; file "$(which php)" | cut -c1-200
          php --ri opentelemetry | grep -iE "version|support"; php --ri xdebug | grep -iE "^Version|Mode"
      - name: Install gdb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
      - name: "1. Control: plain run, no debugger"
        continue-on-error: true
        run: |
          set +e
          php -dzend.assertions=1 vendor/bin/phpunit --coverage-text --coverage-clover=coverage.clover ${{ matrix.target }} > /tmp/plain.txt 2>&1
          echo "EXIT CODE: $?"
          grep -E "^Tests:|^OK" /tmp/plain.txt
      - name: "2. Core dump, analysed after the fact"
        continue-on-error: true
        run: |
          set +e
          sudo sysctl -w kernel.core_pattern='/tmp/core.%e.%p'
          ulimit -c unlimited
          php -dzend.assertions=1 vendor/bin/phpunit --coverage-text --coverage-clover=coverage.clover ${{ matrix.target }} > /tmp/core-run.txt 2>&1
          echo "EXIT CODE: $?"
          grep -E "^Tests:|^OK" /tmp/core-run.txt
          ls -la /tmp/core.* 2>&1 || true
          for c in /tmp/core.*; do
            [ -f "$c" ] || continue
            echo "##### core: $c"
            gdb -batch -nx -ex "set pagination off" -ex "set print frame-arguments none" \
              -ex "echo \n=== CRASHING THREAD ===\n" -ex "info threads" -ex bt 30 \
              -ex "echo \n=== SIGNAL/INSN ===\n" -ex "info registers rip" -ex "x/4i \$rip" -ex "p \$_siginfo._sifields._sigfault.si_addr" \
              -ex "echo \n=== MAIN THREAD ===\n" -ex "thread 1" -ex "bt 25" \
              "$(command -v php)" "$c" > /tmp/gdb-core.txt 2>&1
            grep -vE "^\[New |^\[Thread|^Reading symbols|^warning: |Yes \(\*\)|^0x[0-9a-f]+ +0x[0-9a-f]+" /tmp/gdb-core.txt | cut -c1-300 | head -150
          done
      - name: "3. gdb with ASLR left on"
        continue-on-error: true
        run: |
          gdb -batch -nx -ex "set pagination off" -ex "set confirm off" -ex "set disable-randomization off" \
            -ex "handle SIGPIPE nostop noprint pass" \
            -ex run -ex "echo \n=== BACKTRACE ===\n" -ex bt -ex "thread apply all bt" \
            --args php -dzend.assertions=1 vendor/bin/phpunit --coverage-text --coverage-clover=coverage.clover ${{ matrix.target }} \
            2>&1 | grep -E "SIG|Inferior|exited normally|^#[0-9]+ |=== |Tests:" | grep -v "Thread 0x" | tail -80
